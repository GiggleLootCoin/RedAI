name: Package verified RedAI for GitHub download

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  actions: read
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download verified RedAI artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p package release-package
          gh run download 39529101943 --repo "${{ github.repository }}" --name RedAI --dir package
          GGUF="$(find package -type f -name 'RedAI.gguf' | head -n 1)"
          SUM="$(find package -type f -name 'RedAI.gguf.sha256' | head -n 1)"
          test -s "$GGUF"
          test -s "$SUM"
          cp "$GGUF" release-package/RedAI.gguf
          cp "$SUM" release-package/RedAI.gguf.sha256
          cd release-package
          sha256sum -c RedAI.gguf.sha256
          zip -9 RedAI.zip RedAI.gguf RedAI.gguf.sha256
          ls -lh RedAI.zip

      - name: Upload GitHub Actions download package
        uses: actions/upload-artifact@v6
        with:
          name: RedAI-GGUF-Download
          path: release-package/RedAI.zip
          retention-days: 90
          compression-level: 0
