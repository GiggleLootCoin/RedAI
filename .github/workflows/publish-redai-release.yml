name: Publish RedAI GGUF release

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build RedAI GGUF"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  package:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download verified RedAI artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p package release-package
          RUN_ID="${{ github.event.workflow_run.id }}"
          if [ -z "$RUN_ID" ]; then
            RUN_ID="$(gh run list --repo "${{ github.repository }}" --workflow red-ai-build.yml --branch main --limit 20 --json databaseId,status,conclusion --jq '[.[] | select(.status=="completed" and .conclusion=="success")][0].databaseId')"
          fi
          test -n "$RUN_ID"
          echo "Using verified RedAI build run: $RUN_ID"
          gh run download "$RUN_ID" --repo "${{ github.repository }}" --name RedAI --dir package
          GGUF="$(find package -type f -name 'RedAI.gguf' | head -n 1)"
          SUM="$(find package -type f -name 'RedAI.gguf.sha256' | head -n 1)"
          test -s "$GGUF"
          test -s "$SUM"
          cp "$GGUF" release-package/RedAI.gguf
          cp "$SUM" release-package/RedAI.gguf.sha256
          printf '%s\n' "RedAI — Little Red Big Smile" "Foundation: Qwen2.5-1.5B-Instruct" "Personalization: Red's Ways Of Thinking" "Format: GGUF Q4_K_M" "Target: local/offline Android / Galaxy A12-class hardware" "Verify RedAI.gguf with RedAI.gguf.sha256 before use." > release-package/RedAI-README.txt
          cd release-package
          sha256sum -c RedAI.gguf.sha256
          zip -9 -0 RedAI.zip RedAI.gguf RedAI.gguf.sha256 RedAI-README.txt
          ls -lh RedAI.zip

      - name: Publish permanent GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view redai-latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete redai-latest --repo "${{ github.repository }}" --yes --cleanup-tag
          fi
          gh release create redai-latest             --repo "${{ github.repository }}"             --target main             --title "RedAI — Latest GGUF"             --notes "Final verified RedAI Q4_K_M GGUF built from the latest successful RedAI training pipeline run. Includes RedAI.gguf and its SHA-256 checksum."             release-package/RedAI.zip
