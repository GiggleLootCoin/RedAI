name: Publish verified RedAI package

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download verified RedAI artifact from build run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p package
          gh run download 39529101943 --repo "${{ github.repository }}" --name RedAI --dir package
          GGUF="$(find package -type f -name 'RedAI.gguf' | head -n 1)"
          SUM="$(find package -type f -name 'RedAI.gguf.sha256' | head -n 1)"
          test -s "$GGUF"
          test -s "$SUM"
          mkdir -p release-package
          cp "$GGUF" release-package/RedAI.gguf
          cp "$SUM" release-package/RedAI.gguf.sha256
          cd release-package
          sha256sum -c RedAI.gguf.sha256
          zip -9 RedAI.zip RedAI.gguf RedAI.gguf.sha256
          ls -lh RedAI.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete redai-v1 --repo "${{ github.repository }}" --yes || true
          git fetch --tags
          git tag -f redai-v1
          git push origin refs/tags/redai-v1 --force
          gh release create redai-v1 package/RedAI.zip \
            --repo "${{ github.repository }}" \
            --title "RedAI v1 — Verified GGUF" \
            --notes "Verified RedAI GGUF package. SHA-256 is included in the ZIP."
