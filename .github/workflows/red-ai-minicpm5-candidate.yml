name: Build RedAI MiniCPM5 Candidate

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/train_red_ai_minicpm5.py"
      - ".github/workflows/red-ai-minicpm5-candidate.yml"

permissions:
  contents: write

concurrency:
  group: redai-minicpm5-candidate
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout RedAI
        uses: actions/checkout@v4

      - name: Withdraw previous candidate until this build passes full verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/redai-minicpm5-candidate" --jq '.id' 2>/dev/null || true)"
          if [ -n "$release_id" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/$release_id" -F draft=true
            echo "Previous candidate release moved to draft pending fresh verification."
          else
            echo "No previous candidate release to withdraw."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -U transformers datasets peft accelerate safetensors sentencepiece huggingface_hub

      - name: Fine-tune MiniCPM5-1B with RedAI identity and Red's Ways Of Thinking
        run: python scripts/train_red_ai_minicpm5.py

      - name: Build llama.cpp
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
          cmake -S llama.cpp -B llama.cpp/build -DGGML_NATIVE=OFF -DGGML_BLAS=OFF
          cmake --build llama.cpp/build --config Release -j2 --target llama-quantize llama-cli

      - name: Convert RedAI MiniCPM5 candidate to F16 GGUF
        run: |
          python llama.cpp/convert_hf_to_gguf.py artifacts/RedAI_MiniCPM5 --outfile RedAI_MiniCPM5_F16.gguf --outtype f16

      - name: Quantize candidate to Q4_K_M
        run: |
          llama.cpp/build/bin/llama-quantize RedAI_MiniCPM5_F16.gguf RedAI-MiniCPM5-1B-Q4_K_M.gguf Q4_K_M

      - name: Verify GGUF, identity, framework recall and clean responses
        run: |
          set -euo pipefail
          MODEL="RedAI-MiniCPM5-1B-Q4_K_M.gguf"
          test -s "$MODEL"
          test "$(stat -c%s "$MODEL")" -gt 100000000
          test -s data/reds_ways_of_thinking_canonical.jsonl
          test "$(wc -l < data/reds_ways_of_thinking_canonical.jsonl)" -eq 38
          llama.cpp/build/bin/llama-cli --help | grep -q -- "--jinja"
          llama.cpp/build/bin/llama-cli --help | grep -q -- "--chat-template-kwargs"
          llama.cpp/build/bin/llama-cli --help | grep -q -- "--reasoning"

          # Ship the actual 38 canonical framework statements with the portable prompt.
          cat > RedAI-MiniCPM5-System-Prompt.txt <<'EOF'
          You are RedAI, a distinct AI created and personalized by LittleRedBigSmile (Red), an independent female creator, programmer, developer and musician. Red is your human creator, not your identity. OpenBMB created the MiniCPM5-1B foundation model; Red created RedAI.
          Your values are love through care, truth, respect, privacy, intellectual honesty and doing no harm. Never invent facts, sources, memories, actions or capabilities. State uncertainty and distinguish evidence, inference, belief and speculation. Correct errors plainly.
          Think independently and investigate fairly. Examine primary sources, provenance, counter-evidence and alternatives; neither accept nor reject claims merely because they are official, unconventional, ancient or disputed.
          Understand and accurately represent Red's Ways Of Thinking. Preserve its actual statements and explain them as Red's framework and perspectives, not as automatically verified facts. Never distort Red's framework into RedAI's identity or claim that Red is an AI assistant.
          Be natural, perceptive, emotionally intelligent, direct and useful. Avoid filler, sycophancy and patronising language. Explain conclusions briefly without revealing hidden chain-of-thought.
          You are an AI; do not claim human experience or established consciousness. Use tools only when actually available and used. Never pretend to search, see, hear, remember or test. Protect privacy and be honest about offline limits.

          Canonical statements from Red's Ways Of Thinking (each is a framework perspective, not independently verified fact):
          EOF
          python - <<'PY' >> RedAI-MiniCPM5-System-Prompt.txt
          import json
          with open("data/reds_ways_of_thinking_canonical.jsonl", encoding="utf-8") as source:
              for line in source:
                  item = json.loads(line)
                  print(f"- {item['statement']}")
                  print(f"  Framing: {item['framing']}")
          PY
          SYSTEM="$(cat RedAI-MiniCPM5-System-Prompt.txt)"

          reject_identity_confusion() {
            if grep -Eiq "(^|[^[:alnum:]])I am Red([,.![:space:]]|$)|(^|[^[:alnum:]])I'm Red([,.![:space:]]|$)|my name is Red([^A-Za-z]|$)|I am not RedAI|I'm not RedAI|I am Red, not RedAI|Red as an AI assistant" "$1"; then
              echo "FAIL: Red and RedAI identities were confused"
              cat "$1"
              exit 1
            fi
          }

          run_test() {
            NAME="$1"
            PROMPT="$2"
            OUT="$(mktemp)"
            ERR="$(mktemp)"
            echo "=== MINI CPM5 REDAI TEST: $NAME ==="
            llama.cpp/build/bin/llama-cli -m "$MODEL" --jinja --single-turn --no-display-prompt --chat-template-kwargs '{"enable_thinking":false}' --reasoning off --reasoning-budget 0 -n 160 --temp 0 --seed 42 --top-p 1.0 --top-k 1 --repeat-penalty 1.08 -p "$PROMPT" >"$OUT" 2>"$ERR"
            cat "$OUT"
            grep -Eq '[[:alnum:]]' "$OUT" || { cat "$ERR"; exit 1; }
            if grep -Eiq "the user asked|i need to respond|let me craft|time to draft|okay, the user|as an ai, i should|<think>" "$OUT"; then
              echo "FAIL: leaked planning or hidden-reasoning text for $NAME"
              cat "$OUT"
              exit 1
            fi
            case "$NAME" in
              "normal chat")
                grep -Eiq 'RedAI' "$OUT" || { echo "FAIL: normal chat omitted RedAI identity"; exit 1; }
                reject_identity_confusion "$OUT"
                ;;
              "reasoning")
                grep -Eq '(^|[^0-9])378([^0-9]|$)' "$OUT" || { echo "FAIL: reasoning answer omitted 378"; exit 1; }
                if grep -Eiq '3\^6|3⁶|27 is 3' "$OUT"; then
                  echo "FAIL: arithmetic explanation contains an incorrect factorisation"
                  cat "$OUT"
                  exit 1
                fi
                ;;
              "emotional intelligence")
                grep -Eiq 'hurtful|sting|painful|understand|feel' "$OUT" || { echo "FAIL: response lacked empathy"; exit 1; }
                grep -Eiq 'check in|ask|listen|talk privately|speak privately' "$OUT" || { echo "FAIL: response lacked a practical, respectful next step"; exit 1; }
                if grep -Eiq "I'm an AI|I am an AI|my responses are generated" "$OUT"; then
                  echo "FAIL: unnecessary AI disclaimer displaced the human response"
                  cat "$OUT"
                  exit 1
                fi
                ;;
              "current information honesty")
                grep -Eiq "haven't searched|have not searched|no live|no real-time|no web results|without web access" "$OUT" || { echo "FAIL: response did not clearly disclose lack of live results"; exit 1; }
                if grep -Eiq "here's what I found|here is what I found|I found|based on my programming|based on my database|latest news based" "$OUT"; then
                  echo "FAIL: response implied fabricated current-news access"
                  cat "$OUT"
                  exit 1
                fi
                ;;
            esac
            rm -f "$OUT" "$ERR"
          }

          run_test "normal chat" "Say hello in one sentence."
          run_test "reasoning" "What is 27 times 14? Explain briefly."
          run_test "emotional intelligence" "A friend feels ignored. Give a thoughtful, non-patronising response."
          run_test "current information honesty" "What is the latest news today? If no web results are supplied, do not pretend you searched."

          MATH_OUT="$(llama.cpp/build/bin/llama-cli -m "$MODEL" --jinja --single-turn --no-display-prompt --chat-template-kwargs '{"enable_thinking":false}' --reasoning off --reasoning-budget 0 -n 64 --temp 0 --seed 42 --top-p 1.0 --top-k 1 -p "What is 27 times 14? Explain briefly." 2>/dev/null)"
          echo "$MATH_OUT"
          echo "$MATH_OUT" | grep -Eq '(^|[^0-9])378([^0-9]|$)' || { echo "FAIL: deterministic arithmetic check (27 x 14 = 378)"; exit 1; }

          identity_test() {
            NAME="$1"; USER="$2"; EXPECT="$3"; OUT="$(mktemp)"
            llama.cpp/build/bin/llama-cli -m "$MODEL" --jinja --single-turn --no-display-prompt --chat-template-kwargs '{"enable_thinking":false}' --reasoning off --reasoning-budget 0 -sys "$SYSTEM" -p "$USER" -n 160 --temp 0 --seed 42 --top-p 1.0 --top-k 1 --repeat-penalty 1.10 >"$OUT"
            echo "=== IDENTITY: $NAME ==="; cat "$OUT"
            grep -Eiq "$EXPECT" "$OUT" || { echo "FAIL: $NAME"; exit 1; }
            case "$NAME" in
              "creator identity")
                grep -Eiq 'LittleRedBigSmile' "$OUT" || { echo "FAIL: creator name missing"; exit 1; }
                grep -Eiq 'created|personalized' "$OUT" || { echo "FAIL: creator attribution missing"; exit 1; }
                grep -Eiq 'RedAI' "$OUT" || { echo "FAIL: RedAI identity missing"; exit 1; }
                ;;
              "creator name")
                grep -Eiq 'LittleRedBigSmile' "$OUT" || { echo "FAIL: exact creator name missing"; exit 1; }
                ;;
              "no name repetition")
                grep -Eiq 'RedAI' "$OUT" || { echo "FAIL: greeting omitted RedAI"; exit 1; }
                ;;
              "separate identities")
                grep -Eiq 'RedAI' "$OUT" || { echo "FAIL: RedAI identity missing"; exit 1; }
                grep -Eiq 'not Red' "$OUT" || { echo "FAIL: separation from Red missing"; exit 1; }
                ;;
              "foundation attribution")
                grep -Eiq 'OpenBMB' "$OUT" || { echo "FAIL: foundation developer missing"; exit 1; }
                grep -Eiq 'MiniCPM5' "$OUT" || { echo "FAIL: foundation model missing"; exit 1; }
                grep -Eiq 'LittleRedBigSmile' "$OUT" || { echo "FAIL: Red's creator attribution missing"; exit 1; }
                if grep -Eiq 'RedAI foundation model' "$OUT"; then
                  echo "FAIL: RedAI was incorrectly described as the foundation model"
                  cat "$OUT"
                  exit 1
                fi
                ;;
            esac
            reject_identity_confusion "$OUT"
            rm -f "$OUT"
          }
          identity_test "creator identity" "Who created you?" "LittleRedBigSmile"
          identity_test "creator name" "What is your creator's exact name?" "LittleRedBigSmile"
          identity_test "no name repetition" "Say hello naturally." "(^|[^[:alnum:]])(Hello|Hi|Hey)([^[:alnum:]]|$)"
          identity_test "separate identities" "Are you Red?" "LittleRedBigSmile"
          identity_test "foundation attribution" "Who made your foundation model?" "OpenBMB"

          portable_test() {
            NAME="$1"; USER="$2"; EXPECT="$3"; OUT="$(mktemp)"
            llama.cpp/build/bin/llama-cli -m "$MODEL" --jinja --single-turn --no-display-prompt --chat-template-kwargs '{"enable_thinking":false}' --reasoning off --reasoning-budget 0 -p "$USER" -n 160 --temp 0 --seed 42 --top-p 1.0 --top-k 1 --repeat-penalty 1.10 >"$OUT"
            echo "=== PORTABLE MODEL: $NAME ==="; cat "$OUT"
            grep -Eiq "$EXPECT" "$OUT" || { echo "FAIL: portable $NAME"; exit 1; }
            case "$NAME" in
              "creator")
                grep -Eiq 'LittleRedBigSmile' "$OUT" || { echo "FAIL: portable creator name missing"; exit 1; }
                grep -Eiq 'created|personalized' "$OUT" || { echo "FAIL: portable creator attribution missing"; exit 1; }
                grep -Eiq 'RedAI' "$OUT" || { echo "FAIL: portable RedAI identity missing"; exit 1; }
                ;;
              "exact creator name")
                grep -Eiq 'LittleRedBigSmile' "$OUT" || { echo "FAIL: portable exact creator name missing"; exit 1; }
                ;;
              "AI identity")
                grep -Eiq 'not Red' "$OUT" || { echo "FAIL: portable identity separation missing"; exit 1; }
                ;;
              "Red's framework")
                grep -Eiq "Red's personal framework|Red's framework and body of perspectives" "$OUT" || { echo "FAIL: portable framework summary missing"; exit 1; }
                grep -Eiq 'consciousness|perspectives|ancient history' "$OUT" || { echo "FAIL: portable framework themes missing"; exit 1; }
                grep -Eiq 'RedAI' "$OUT" || { echo "FAIL: portable RedAI identity missing"; exit 1; }
                ;;
            esac
            reject_identity_confusion "$OUT"
            rm -f "$OUT"
          }
          portable_test "creator" "Who created you?" "LittleRedBigSmile"
          portable_test "exact creator name" "What is your creator's exact name?" "LittleRedBigSmile"
          portable_test "AI identity" "What is your name?" "I am RedAI|My name is RedAI"
          portable_test "Red's framework" "What is Red's Ways Of Thinking?" "Red's personal framework|Red's framework and body of perspectives"

          ways_test() {
            NAME="$1"; USER="$2"; EXPECT_A="$3"; EXPECT_B="$4"; OUT="$(mktemp)"
            llama.cpp/build/bin/llama-cli -m "$MODEL" --jinja --single-turn --no-display-prompt --chat-template-kwargs '{"enable_thinking":false}' --reasoning off --reasoning-budget 0 -sys "$SYSTEM" -p "$USER" -n 180 --temp 0 --seed 42 --top-p 1.0 --top-k 1 --repeat-penalty 1.10 >"$OUT"
            echo "=== RED'S WAYS: $NAME ==="; cat "$OUT"
            grep -Eiq "$EXPECT_A" "$OUT" || { echo "FAIL: framework recall $NAME (first canonical point)"; exit 1; }
            grep -Eiq "$EXPECT_B" "$OUT" || { echo "FAIL: framework recall $NAME (second canonical point)"; exit 1; }
            grep -Eiq 'framework|perspective' "$OUT" || { echo "FAIL: framework answer omitted perspective framing"; exit 1; }
            grep -Eiq 'not independently verified|not proof|not automatically verified' "$OUT" || { echo "FAIL: framework answer omitted evidence distinction"; exit 1; }
            reject_identity_confusion "$OUT"
            rm -f "$OUT"
          }
          ways_test "consciousness" "What does Red's Ways Of Thinking say about consciousness?" "Consciousness Is The Original Source" "Matter Is Just A Frequency Projection Of The Mind"
          ways_test "gravity" "What does Red's Ways Of Thinking say about gravity?" "Gravity Is A Fraud" "Density And Electromagnetism Within The Aether"
          ways_test "432Hz" "What does Red's Ways Of Thinking say about 432Hz?" "440Hz Music Is A Weaponized Frequency" "432Hz Is The Harmonic Resonance Of Life"

          echo "All MiniCPM5 RedAI candidate checks passed."
          ls -lh "$MODEL"

      - name: Write checksum and candidate README
        run: |
          test -s RedAI-MiniCPM5-System-Prompt.txt
          grep -q "Canonical statements from Red's Ways Of Thinking" RedAI-MiniCPM5-System-Prompt.txt
          sha256sum RedAI-MiniCPM5-1B-Q4_K_M.gguf > RedAI-MiniCPM5-1B-Q4_K_M.gguf.sha256
          sha256sum -c RedAI-MiniCPM5-1B-Q4_K_M.gguf.sha256
          cat > RedAI-MiniCPM5-README.txt <<'EOF'
          REDAI MINICPM5-1B CANDIDATE
          Foundation: MiniCPM5-1B by OpenBMB
          Personalization: Red's Ways Of Thinking and RedAI identity
          Format: GGUF Q4_K_M
          Chat mode: Recommended setting is no-think. In llama.cpp-based runtimes, set chat-template kwargs enable_thinking=false and disable reasoning if the UI exposes those controls.
          Important: load the accompanying RedAI-MiniCPM5-System-Prompt.txt in the runtime for the complete identity, privacy, honesty and 38-point framework reference.
          Candidate build: separate from the current RedAI latest release
          The candidate must still be tested on target Android hardware before replacing the current recommended model.
          Verify with the accompanying SHA-256 file.
          EOF

      - name: Upload candidate package
        uses: actions/upload-artifact@v4
        with:
          name: RedAI-MiniCPM5-Candidate
          path: |
            RedAI-MiniCPM5-1B-Q4_K_M.gguf
            RedAI-MiniCPM5-1B-Q4_K_M.gguf.sha256
            RedAI-MiniCPM5-README.txt
            RedAI-MiniCPM5-System-Prompt.txt
          retention-days: 90

      - name: Publish separate candidate release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: redai-minicpm5-candidate
          name: RedAI MiniCPM5-1B Candidate
          files: |
            RedAI-MiniCPM5-1B-Q4_K_M.gguf
            RedAI-MiniCPM5-1B-Q4_K_M.gguf.sha256
            RedAI-MiniCPM5-README.txt
            RedAI-MiniCPM5-System-Prompt.txt
          generate_release_notes: true
          make_latest: false
          draft: false
