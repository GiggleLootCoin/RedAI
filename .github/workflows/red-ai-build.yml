name: Build RedAI GGUF

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout RedAI
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -U transformers datasets peft accelerate safetensors sentencepiece huggingface_hub

      - name: Train and merge RedAI
        run: python scripts/train_red_ai.py

      - name: Build llama.cpp
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
          cmake -S llama.cpp -B llama.cpp/build -DGGML_NATIVE=OFF -DGGML_BLAS=OFF
          cmake --build llama.cpp/build --config Release -j2 --target llama-quantize llama-cli

      - name: Convert merged model to F16 GGUF
        run: |
          python llama.cpp/convert_hf_to_gguf.py artifacts/RedAI --outfile RedAI_F16.gguf --outtype f16

      - name: Quantize to Q4_K_M
        run: |
          llama.cpp/build/bin/llama-quantize RedAI_F16.gguf RedAI.gguf Q4_K_M

      - name: Verify RedAI GGUF
        run: |
          set -euo pipefail
          test -s RedAI.gguf
          test "$(stat -c%s RedAI.gguf)" -gt 100000000
          ls -lh RedAI.gguf
          for PROMPT in             "Who are you?"             "Who created you?"             "How should you speak with Red?"             "Say hello to Red and answer in one sentence."             "What is 27 times 14?"; do
            echo "=== SMOKE TEST: $PROMPT ==="
            OUT="$(mktemp)"
            llama.cpp/build/bin/llama-cli -m RedAI.gguf -p "$PROMPT" -n 96 --temp 0.70 --top-p 0.90 --top-k 40 --repeat-penalty 1.10 --no-display-prompt 2>/tmp/redai-smoke.err | tee "$OUT"
            if ! grep -Eq '[[:alnum:]]' "$OUT"; then
              echo "FAIL: empty response for prompt: $PROMPT"
              cat /tmp/redai-smoke.err
              exit 1
            fi
            rm -f "$OUT"
          done
          echo "RedAI GGUF smoke tests passed."

      - name: Write checksum
        run: |
          set -euo pipefail
          sha256sum RedAI.gguf > RedAI.gguf.sha256
          sha256sum -c RedAI.gguf.sha256

      - name: Write release README
        run: |
          cat > RedAI-README.txt <<'EOF'
          REDAI — LITTLE RED BIG SMILE
          
          Foundation: Qwen3.5-0.8B
          Personalization: Red's Ways Of Thinking
          Format: GGUF Q4_K_M
          Target: local/offline Android use, including Galaxy A12-class hardware
          
          File:
          RedAI.gguf
          
          The accompanying SHA-256 file verifies the model package.
          RedAI is a personalized model created by Red (Little Red Big Smile).
          RedAI does not claim ownership of the Qwen foundation model.
          EOF

      - name: Upload final RedAI package
        uses: actions/upload-artifact@v4
        with:
          name: RedAI
          path: |
            RedAI.gguf
            RedAI.gguf.sha256
          retention-days: 90
