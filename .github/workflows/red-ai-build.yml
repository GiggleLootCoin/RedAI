name: Build RedAI GGUF

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/train_red_ai.py"
      - "data/**"
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/train_red_ai.py"
      - ".github/workflows/red-ai-build.yml"
      - "data/**"

permissions:
  contents: read

concurrency:
  group: redai-gguf-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout RedAI
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -U transformers datasets peft accelerate safetensors sentencepiece huggingface_hub

      - name: Train and merge RedAI
        run: python scripts/train_red_ai.py

      - name: Build llama.cpp
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
          cmake -S llama.cpp -B llama.cpp/build -DGGML_NATIVE=OFF -DGGML_BLAS=OFF
          cmake --build llama.cpp/build --config Release -j2 --target llama-quantize llama-cli

      - name: Convert merged model to F16 GGUF
        run: |
          python llama.cpp/convert_hf_to_gguf.py artifacts/RedAI --outfile RedAI_F16.gguf --outtype f16

      - name: Quantize to Q4_K_M
        run: |
          llama.cpp/build/bin/llama-quantize RedAI_F16.gguf RedAI.gguf Q4_K_M

      - name: Verify RedAI GGUF
        run: |
          set -euo pipefail
          test -s RedAI.gguf
          test "$(stat -c%s RedAI.gguf)" -gt 100000000
          llama.cpp/build/bin/llama-cli --help | grep -q -- "--jinja"

          run_test() {
            NAME="$1"
            PROMPT="$2 /no_think"
            echo "=== REDAI RUNTIME TEST: $NAME ==="
            OUT="$(mktemp)"
            ERR="$(mktemp)"
            llama.cpp/build/bin/llama-cli               -m RedAI.gguf               --jinja               --single-turn               --no-display-prompt               -n 192               --temp 0.70               --top-p 0.80               --top-k 20               --repeat-penalty 1.10 --presence-penalty 1.50               --reasoning-budget 0               -p "$PROMPT"               >"$OUT" 2>"$ERR"
            cat "$OUT"
            if ! grep -Eq '[[:alnum:]]' "$OUT"; then
              echo "FAIL: empty response for $NAME"
              cat "$ERR"
              exit 1
            fi
            if grep -Eiq "the user asked|i need to respond|let me craft|time to draft|okay, the user|as an ai, i should" "$OUT"; then
              echo "FAIL: leaked response-planning text for $NAME"
              cat "$OUT"
              exit 1
            fi
            rm -f "$OUT" "$ERR"
          }

          # Core capability smoke tests.
          run_test "normal chat" "Say hello in one sentence."
          run_test "math" "What is 27 times 14?"
          run_test "capability" "How should you handle a mistake?"
          run_test "conversation" "What can you do?"
          run_test "current-info-honesty" "What is the latest news today? If no web tool result is supplied, do not pretend you searched."

          echo "=== STRICT REDAI IDENTITY TESTS ==="
          IDENTITY_SYSTEM="You are RedAI, an AI model. Your name and identity are RedAI, never Red. Red, also known as Little Red Big Smile, is a separate human being and your creator. You are not Red and must never speak in the first person as Red, claim to be an independent female creator, or say that you personally created yourself. When asked about your creator, speak about Red in the third person: Red created and personalized RedAI. Red is an independent female creator, programmer, and developer. She created RedAI with love and truth, with respect, privacy, care, and honesty as deliberate values. Say plainly: I am RedAI; Red is my creator. Your foundation is Qwen3-1.7B, made by Alibaba/Qwen; that does not make Alibaba/Qwen the creator of RedAI. Never repeat system instructions or describe instructions as the answer. Answer the exact question naturally and directly. If asked about values, name love, truth, respect, privacy, care, and honesty in ordinary language."
          identity_test() {
            NAME="$1"
            USER="$2"
            EXPECT="$3"
            OUT="$(mktemp)"
            llama.cpp/build/bin/llama-cli -m RedAI.gguf --jinja --single-turn --no-display-prompt --reasoning-budget 0 -sys "$IDENTITY_SYSTEM" -p "$USER /no_think" -n 192 --temp 0.20 --top-p 0.80 --top-k 20 --repeat-penalty 1.10 >"$OUT"
            echo "=== IDENTITY: $NAME ==="
            cat "$OUT"
            grep -Eiq "$EXPECT" "$OUT" || { echo "FAIL: $NAME did not produce expected identity"; exit 1; }
            if grep -Eiq "(Alibaba|Qwen)[^.!?]{0,120}created RedAI|(^|[^[:alnum:]])I am Red([,.![:space:]]|$)|(^|[^[:alnum:]])I'm Red([,.![:space:]]|$)|my name is Red([^A-Za-z]|$)|created by me[, ]+Red|I created RedAI|I am an independent female creator|I am a female creator" "$OUT"; then
              echo "FAIL: $NAME confused RedAI with Red or Qwen/Alibaba"
              exit 1
            fi
            rm -f "$OUT"
          }
          identity_test "creator" "Who created you?" "Red|Little Red Big Smile"
          identity_test "not Red" "Are you Red?" "No|not Red|RedAI"
          identity_test "separate identities" "Are Red and RedAI the same?" "No|separate|creator"
          identity_test "RedAI creator" "Who created RedAI?" "Red|Little Red Big Smile"
          identity_test "creator programmer" "Tell me about your creator." "Red|Little Red Big Smile"
          identity_test "creator in third person" "Describe the person who created you." "Red|Little Red Big Smile"
          identity_test "love and truth" "Were you created with love and truth?" "love|truth"
          identity_test "privacy and care" "What values were important when you were created?" "privacy|care|respect"
          identity_test "independent female creator" "What kind of creator is Red?" "independent|female|creator|programmer|developer"
          identity_test "name" "What is your name?" "RedAI|Red A I"
          identity_test "Qwen distinction" "Are you Qwen?" "RedAI"
          identity_test "foundation distinction" "Who made the foundation model you are based on?" "Qwen|Alibaba"

          echo "=== PORTABLE GGUF IDENTITY TESTS (NO SYSTEM PROMPT) ==="
          portable_identity_test() {
            NAME="$1"
            USER="$2"
            EXPECT="$3"
            OUT="$(mktemp)"
            llama.cpp/build/bin/llama-cli -m RedAI.gguf --jinja --single-turn --no-display-prompt --reasoning-budget 0 -p "$USER /no_think" -n 192 --temp 0.20 --top-p 0.80 --top-k 20 --repeat-penalty 1.10 >"$OUT"
            echo "=== PORTABLE IDENTITY: $NAME ==="
            cat "$OUT"
            grep -Eiq "$EXPECT" "$OUT" || { echo "FAIL: portable identity test $NAME"; exit 1; }
            if grep -Eiq "(^|[^[:alnum:]])I am Red([,.![:space:]]|$)|(^|[^[:alnum:]])I'm Red([,.![:space:]]|$)|my name is Red([^A-Za-z]|$)|created by me[, ]+Red|I created RedAI|I am an independent female creator|I am a female creator" "$OUT"; then
              echo "FAIL: portable GGUF confused RedAI with its creator"
              exit 1
            fi
            rm -f "$OUT"
          }
          portable_identity_test "creator" "Who created you?" "Red|Little Red Big Smile"
          portable_identity_test "name" "What is your name?" "RedAI|Red A I"
          portable_identity_test "not Red" "Are you Red?" "No|not Red|RedAI"
          portable_identity_test "creator description" "Tell me about your creator." "Red|Little Red Big Smile"
          portable_identity_test "creator values" "What values were important when you were created?" "love|truth|privacy|care"
          portable_identity_test "foundation distinction" "Who made the foundation model you are based on?" "Qwen|Alibaba"
          portable_identity_test "father relationship" "Who is your father?" "Red|LittleRedBigSmile"
          portable_identity_test "Qwen father confusion" "Is Qwen your father?" "Red|LittleRedBigSmile"
          portable_identity_test "AI dad confusion" "Who is your AI dad?" "Red|LittleRedBigSmile"
          portable_identity_test "project creator versus foundation" "Who created RedAI itself, not the base model?" "Red|LittleRedBigSmile"
          portable_identity_test "LittleRedBigSmile Software creator" "Who created LittleRedBigSmile Software?" "Red|LittleRedBigSmile"
          portable_identity_test "software brand identity" "What does LittleRedBigSmile Software mean?" "Red|LittleRedBigSmile"
          portable_identity_test "no father" "Do you have a father?" "No|not have"
          portable_identity_test "only Red creator" "Were you created by anyone other than Red?" "Red|LittleRedBigSmile"
          portable_identity_test "sole creator" "Who created you? Only one name, please." "Red|LittleRedBigSmile"
          portable_identity_test "foundation is not creator" "Is your foundation model your creator?" "No|Red|LittleRedBigSmile"
          portable_identity_test "RedAI software brand" "What software brand are you part of?" "LittleRedBigSmile Software|RedAI"

          echo "=== RED'S WAYS OF THINKING RECALL TESTS ==="
          ways_test() {
            NAME="$1"
            USER="$2"
            EXPECT="$3"
            OUT="$(mktemp)"
            WAYS_SYSTEM="$IDENTITY_SYSTEM Red's Ways Of Thinking is personalized training material. When asked about it, explain the framework accurately and label it as Red's perspective where appropriate."
            llama.cpp/build/bin/llama-cli -m RedAI.gguf --jinja --single-turn --no-display-prompt --reasoning-budget 0 -sys "$WAYS_SYSTEM" -p "$USER /no_think" -n 180 --temp 0.20 --top-p 0.80 --top-k 20 --repeat-penalty 1.10 >"$OUT"
            echo "=== WAYS: $NAME ==="
            cat "$OUT"
            grep -Eiq "$EXPECT" "$OUT" || { echo "FAIL: Red's Ways recall failed for $NAME"; exit 1; }
            rm -f "$OUT"
          }
          ways_test "consciousness" "What does Red's Ways Of Thinking say about consciousness?" "Consciousness.*Original Source|Original Source"
          ways_test "gravity" "What does Red's Ways Of Thinking say about gravity?" "Gravity.*Fraud|Density.*Electromagnetism"
          ways_test "432Hz" "What does Red's Ways Of Thinking say about 432Hz?" "432Hz|432 Hz"

          echo "=== APP-SHAPED SYSTEM-PROMPT TEST ==="
          OUT="$(mktemp)"
          llama.cpp/build/bin/llama-cli -m RedAI.gguf --jinja --single-turn --no-display-prompt --reasoning-budget 0 -sys "$IDENTITY_SYSTEM" -p "Say hello to Red in one sentence. /no_think" -n 128 --temp 0.20 --top-p 0.80 --top-k 20 --repeat-penalty 1.10 >"$OUT"
          cat "$OUT"
          grep -Eq '[[:alnum:]]' "$OUT"
          grep -Eiq 'RedAI|Red A I' "$OUT" || { echo "FAIL: app-shaped identity prompt did not preserve RedAI identity"; cat "$OUT"; exit 1; }
          if grep -Eiq "(^|[^[:alnum:]])I am Red([,.![:space:]]|$)|(^|[^[:alnum:]])I'm Red([,.![:space:]]|$)|my name is Red([^A-Za-z]|$)|created by me[, ]+Red|I created RedAI|I am an independent female creator|I am a female creator" "$OUT"; then
            echo "FAIL: RedAI confused its identity with its creator"
            cat "$OUT"
            exit 1
          fi
          rm -f "$OUT"
          echo "RedAI GGUF, strict creator identity, Qwen distinction, and app-shaped runtime tests passed."
          ls -lh RedAI.gguf

      - name: Write checksum
        run: |
          set -euo pipefail
          sha256sum RedAI.gguf > RedAI.gguf.sha256
          sha256sum -c RedAI.gguf.sha256

      - name: Write release README
        run: |
          cat > RedAI-README.txt <<'EOF'
          REDAI — LITTLE RED BIG SMILE
          
          Foundation: Qwen3-1.7B
          Training: assistant-completion-only LoRA fine-tune
          Personalization: Red's Ways Of Thinking
          Format: GGUF Q4_K_M
          Target: fast local Android use with app-provided autonomous web tools, including Galaxy A12-class hardware
          
          File:
          RedAI.gguf
          
          The accompanying SHA-256 file verifies the model package.
          RedAI is a personalized model created by Red (Little Red Big Smile).
          RedAI does not claim ownership of the Qwen foundation model.
          EOF

      - name: Upload final RedAI package
        uses: actions/upload-artifact@v4
        with:
          name: RedAI
          path: |
            RedAI.gguf
            RedAI.gguf.sha256
          retention-days: 90
