name: Build RedAI Android

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "android-ui/**"
      - ".github/workflows/build-redai-android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build signed ARM64 APK
        working-directory: android-ui
        run: gradle --no-daemon assembleDebug

      - name: Verify APK runtime and UI
        run: |
          set -euo pipefail
          APK="android-ui/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q "classes.dex"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libllama.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libllama_jni.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libggml-cpu.so"
          grep -q 'append("\\n\\n/no_think")' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -q 'Your name is RedAI; Red is your creator, not your name.' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -q 'CREATED WITH LOVE BY LITTLE RED BIG SMILE' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -q 'versionName = "3.1"' android-ui/app/build.gradle.kts
          echo "RedAI Android runtime libraries, response path, identity prompt, and v3.1 UI checks passed."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedAI-Android-arm64-signed
          path: android-ui/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="redai-android"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG"             android-ui/app/build/outputs/apk/debug/app-debug.apk             --title "RedAI Android — Local GGUF"             --notes "RedAI Android v3.1 corrected premium UI rebuild with corrected local response prompting, RedAI identity guardrails, improved black/red interface, auto-scrolling chat, and verified ARM64 llama.cpp runtime libraries. Installable CPU/ARM64 debug build for Android."             --latest
