name: Build RedAI Android

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main", "redai-redesign-v4", "redai-rebuild-v5"]
    paths:
      - "android-ui/**"
      - "README.md"
      - "bridge/**"
      - "WEB_SEARCH.md"
      - ".github/workflows/build-redai-android.yml"

permissions:
  contents: write

concurrency:
  group: redai-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare pinned native engine with conservative ARM64 dispatch
        run: |
          set -euo pipefail
          git clone --depth 1 --branch V2.1 --recurse-submodules https://github.com/woheller69/SmolChatAndroidLib.git /tmp/SmolChatAndroidLib
          test -f /tmp/SmolChatAndroidLib/smollm/llama.cpp/include/llama.h
          cp -a /tmp/SmolChatAndroidLib/smollm android-ui/smollm
          cat > android-ui/smollm/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.library")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "io.shubham0204.smollm"
              compileSdk = 35
              ndkVersion = "27.2.12479018"
              defaultConfig {
                  minSdk = 26
                  ndk { abiFilters += listOf("arm64-v8a") }
                  externalNativeBuild {
                      cmake {
                          arguments += listOf("-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON")
                          arguments += "-DCMAKE_BUILD_TYPE=Release"
                          arguments += "-DBUILD_SHARED_LIBS=ON"
                          arguments += "-DLLAMA_BUILD_COMMON=ON"
                          arguments += "-DLLAMA_CURL=OFF"
                          arguments += "-DGGML_LLAMAFILE=OFF"
                      }
                  }
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              externalNativeBuild {
                  cmake {
                      path = file("src/main/cpp/CMakeLists.txt")
                      version = "3.22.1"
                  }
              }
          }
          dependencies {
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.1")
          }
          EOF
          python3 - <<'PY'
          from pathlib import Path
          cmake = Path("android-ui/smollm/src/main/cpp/CMakeLists.txt")
          source = cmake.read_text(encoding="utf-8")
          start = source.find('if (${ANDROID_ABI} STREQUAL "arm64-v8a")')
          end = source.find("\nendif()", start)
          baseline = '    build_library_arm64("smollm_v8" "-march=armv8-a")'
          if start < 0 or end < 0 or baseline not in source[start:end]:
              raise SystemExit("Could not locate the native ARM64 baseline target.")
          source = source[:start] + 'if (${ANDROID_ABI} STREQUAL "arm64-v8a")\n' + baseline + source[end:]
          cmake.write_text(source, encoding="utf-8")
          kt = Path("android-ui/smollm/src/main/java/io/shubham0204/smollm/SmolLM.kt")
          source = kt.read_text(encoding="utf-8")
          start = source.index("            // check if the following CPU features")
          end = source.index("\n        }\n\n        /**", start)
          replacement = """            // Use the conservative ARMv8-A library on all ARM64 phones.
                      // This avoids selecting optional CPU extensions that some devices
                      // or vendor kernels may report incorrectly.
                      if (Build.SUPPORTED_ABIS.contains("arm64-v8a")) {
                          Log.i(logTag, "Loading conservative ARMv8 baseline library")
                          System.loadLibrary("smollm_v8")
                      } else if (Build.SUPPORTED_32_BIT_ABIS.firstOrNull() == "armeabi-v7a") {
                          Log.i(logTag, "Loading ARMv7 baseline library")
                          System.loadLibrary("smollm_v7a")
                      } else {
                          Log.i(logTag, "Loading universal baseline library")
                          System.loadLibrary("smollm")
                      }"""
          source = source[:start] + replacement + source[end:]
          kt.write_text(source, encoding="utf-8")
          assert "Loading conservative ARMv8 baseline library" in source
          assert 'build_library_arm64("smollm_v8" "-march=armv8-a")' in cmake.read_text(encoding="utf-8")
          print("Pinned SmolChatAndroidLib V2.1 and disabled optional ARM64 CPU-specialized dispatch.")
          PY
      - name: Download and verify the trained RedAI MiniCPM5-1B Q4_K_M brain
        run: |
          set -euo pipefail
          mkdir -p android-ui/app/src/main/assets
          MODEL_URL="https://github.com/GiggleLootCoin/RedAI/releases/download/redai-minicpm5-candidate/RedAI-MiniCPM5-1B-Q4_K_M.gguf"
          curl -L --fail --retry 5 --retry-all-errors --connect-timeout 30 --output android-ui/app/src/main/assets/RedAI.gguf "$MODEL_URL"
          echo "eca3959621ebc7c4dc49f8f7bcdb015642e6c37d7f8a26dcd4d95d9072d40052  android-ui/app/src/main/assets/RedAI.gguf" | sha256sum --check
          python3 - <<'PY'
          import json
          from pathlib import Path
          model = Path("android-ui/app/src/main/assets/RedAI.gguf")
          with model.open("rb") as f:
              assert f.read(4) == b"GGUF", "Downloaded model is not GGUF"
          assert model.stat().st_size > 500 * 1024 * 1024, "Unexpectedly small GGUF"
          source = Path("data/reds_ways_of_thinking_canonical.jsonl")
          rows = [json.loads(line) for line in source.read_text(encoding="utf-8").splitlines() if line.strip()]
          assert len(rows) == 38, f"Expected 38 canonical framework statements, got {len(rows)}"
          Path("android-ui/app/src/main/assets/reds_ways_of_thinking_canonical.jsonl").write_text(
              source.read_text(encoding="utf-8"), encoding="utf-8"
          )
          notice = Path("android-ui/app/src/main/assets/RED AI MODEL NOTICE.txt").read_text(encoding="utf-8")
          assert "Apache License 2.0" in notice and "MiniCPM5-1B" in notice and "Fine-tuned RedAI candidate" in notice
          print(f"Verified {model.stat().st_size:,}-byte trained MiniCPM5-1B GGUF and {len(rows)} canonical framework statements.")
          PY

      - name: Smoke-test the exact bundled GGUF with the app's llama.cpp version
        run: |
          set -euo pipefail
          ARCHIVE="/tmp/llama-b9878-bin-ubuntu-x64.tar.gz"
          curl -L --fail --retry 5 --retry-all-errors --output "$ARCHIVE" \
            "https://github.com/ggml-org/llama.cpp/releases/download/b9878/llama-b9878-bin-ubuntu-x64.tar.gz"
          echo "fa52c1bdc6a17f28bfeaad28ca6783ff94cf85f36dca4a4bb2d9c7e8687c007b  $ARCHIVE" | sha256sum --check
          mkdir -p /tmp/llama-b9878
          tar -xzf "$ARCHIVE" -C /tmp/llama-b9878
          LLAMA_CLI="$(find /tmp/llama-b9878 -type f -name llama-cli -print -quit)"
          test -x "$LLAMA_CLI"
          LIB_DIRS="$(find /tmp/llama-b9878 -type f \( -name 'libllama.so' -o -name 'libggml*.so' \) -printf '%h\n' | sort -u | paste -sd:)"
          export LD_LIBRARY_PATH="$LIB_DIRS:${LD_LIBRARY_PATH:-}"
          "$LLAMA_CLI" --version
          OUT="$(mktemp)"
          "$LLAMA_CLI" \
            -m android-ui/app/src/main/assets/RedAI.gguf \
            --jinja --single-turn --no-display-prompt \
            --chat-template-kwargs '{"enable_thinking":false}' --reasoning off \
            -n 48 --temp 0.7 --top-p 0.95 --top-k 40 \
            -p "Say hello in one clear sentence." > "$OUT"
          cat "$OUT"
          grep -Eq '[[:alnum:]]' "$OUT"
          rm -f "$OUT"

      - name: Install Gradle
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Test standalone search bridge
        run: |
          python3 -m unittest discover -s bridge -p 'test_*.py' -v
          python3 -m json.tool bridge/search_web_tool.json > /dev/null
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "bridge")
          import redai_search_bridge as bridge
          result = bridge.search("Wikipedia live search smoke test", "wikipedia")
          assert result["ok"] and result["results"], "No live Wikipedia search results returned"
          assert all(item["url"].startswith("https://") for item in result["results"]), "A source URL was missing or unsafe"
          print("Live no-key Wikipedia search returned", len(result["results"]), "source links.")
          PY

      - name: Build ARM64 debug-signed APK
        working-directory: android-ui
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "RedAI Android build attempt $attempt/3"
            if gradle --no-daemon assembleDebug 2>&1 | tee "/tmp/redai-gradle-attempt-$attempt.log"; then
              exit 0
            fi
            if ! grep -Eqi 'Premature end of Content-Length|Could not download|Could not get resource|Could not resolve all files' "/tmp/redai-gradle-attempt-$attempt.log"; then
              echo "Gradle failed for a reason other than a transient dependency download; stopping without masking the real error."
              exit 1
            fi
            echo "A remote Maven/JitPack download was interrupted. Clearing only the affected SmolChat artifact cache before retry."
            rm -rf "$HOME/.gradle/caches/modules-2/files-2.1/com.github.woheller69/SmolChatAndroidLib"
            rm -rf "$HOME/.gradle/caches/modules-2/metadata-2"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 12)); fi
          done
          echo "Dependency download failed after three attempts."
          exit 1

      - name: Verify APK runtime and UI
        run: |
          set -euo pipefail
          APK="android-ui/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q "classes.dex"
          unzip -l "$APK" | grep -q "assets/RedAI.gguf"
          unzip -l "$APK" | grep -q "assets/reds_ways_of_thinking_canonical.jsonl"
          unzip -l "$APK" | grep -q "assets/RED AI MODEL NOTICE.txt"
          unzip -l "$APK" | grep -Eq "lib/arm64-v8a/libsmollm(_v8.*)?\\.so"
          grep -Fq '/no_think' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'SmolLM.InferenceParams' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'getResponseAsFlow' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'flowOn(Dispatchers.Default)' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'activeEngine.stop()' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'activeEngine.getResponseGenerationSpeed()' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'private var engine: SmolLM? = null' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'if (uiCreated) return' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'memoryInfo.lowMemory' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'getHistoricalProcessExitReasons' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          test "$(grep -c 'setContent {' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt)" -eq 1
          grep -Fq 'chatTemplate = miniCpm5NoThinkTemplate()' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'private suspend fun extractPdfText' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'private suspend fun extractImageText' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'TextRecognition.getClient' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'ON-DEVICE TEXT RECOGNITION (OCR)' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          ! grep -Eq 'ImageLabeling|ImageLabeler|ImageLabel' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'SpeechRecognizer.isRecognitionAvailable' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'android.speech.RecognitionService' android-ui/app/src/main/AndroidManifest.xml
          grep -Fq 'appendHistoryExchange' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'generate(modelPrompt, allowSearch = false)' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'val searchRequested = allowSearch && needsFreshInfo(query)' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'private fun persistCurrentSession()' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'private fun switchConversation(id: String)' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'private fun deleteConversation(id: String)' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'SAVED CHATS' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'CREATE A CHARACTER PROFILE' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'USER-CREATED CHARACTER PROFILE' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'availableOfflineEnglishVoices' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'NEXT VOICE' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'tts_voice_name' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          ! grep -Fq 'image-labeling' android-ui/app/build.gradle.kts
          ! grep -Fq 'android.permission.CAMERA' android-ui/app/src/main/AndroidManifest.xml
          grep -Fq 'contextSize = 256L' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'minimumFreeRamMb = 1280L' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'Color(0xFFE5092A)' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          ! grep -Fq 'Color(0xFF00B879)' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt

          grep -Fq 'android:fillColor="#E5092A"' android-ui/app/src/main/res/drawable/ic_redai_launcher_foreground.xml
          grep -Fq 'availableRamMb < minimumFreeRamMb' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'numThreads = 2' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'StatFs(dir.absolutePath).availableBytes' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'Not enough free storage to install RedAI' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'modelLoadRequested = true' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'startup stays lightweight' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          ! grep -Fq 'lifecycleScope.launch { autoLoadSavedModel() }' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'android:icon="@mipmap/ic_launcher"' android-ui/app/src/main/AndroidManifest.xml
          test -s android-ui/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s android-ui/app/src/main/res/drawable/ic_redai_launcher_foreground.xml
          grep -Fq 'If asked about the foundation model, explain that your underlying foundation model is the one represented by the GGUF file currently loaded' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'Do not automatically accept official accounts or automatically reject them' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -q 'CREATED WITH LOVE BY LittleRedBigSmile' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -q 'class WebSearchService' android-ui/app/src/main/java/com/giggleloot/redai/WebSearchService.kt
          grep -q 'AES/GCM/NoPadding' android-ui/app/src/main/java/com/giggleloot/redai/WebSearchService.kt
          grep -q 'webSearch.search(query, webProvider)' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -q 'searchWikipedia' android-ui/app/src/main/java/com/giggleloot/redai/WebSearchService.kt
          grep -q 'searchTavily' android-ui/app/src/main/java/com/giggleloot/redai/WebSearchService.kt
          grep -Fq 'temporary = File(dir, "RedAI.gguf.part")' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'The bundled GGUF failed its SHA-256 or file-format check.' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'redWaysOfThinkingPrompt(query)' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'LOAD REDAI' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -q 'versionName = "5.6.0"' android-ui/app/build.gradle.kts
          grep -q 'versionCode = 22' android-ui/app/build.gradle.kts
          grep -Fq 'implementation(project(":smollm"))' android-ui/app/build.gradle.kts
          grep -q 'android:icon="@mipmap/ic_launcher"' android-ui/app/src/main/AndroidManifest.xml
          test -s android-ui/app/src/main/res/drawable/ic_redai_launcher.xml
          grep -q 'applicationId = "com.giggleloot.redai.v4"' android-ui/app/build.gradle.kts
          python3 - <<'PY'
          import hashlib, json, zipfile
          apk = "android-ui/app/build/outputs/apk/debug/app-debug.apk"
          expected = "eca3959621ebc7c4dc49f8f7bcdb015642e6c37d7f8a26dcd4d95d9072d40052"
          with zipfile.ZipFile(apk) as z:
              model_name = next(n for n in z.namelist() if n.endswith("assets/RedAI.gguf"))
              digest = hashlib.sha256()
              with z.open(model_name) as f:
                  magic = f.read(4)
                  assert magic == b"GGUF", "Embedded model is not GGUF"
                  digest.update(magic)
                  while True:
                      block = f.read(1024 * 1024)
                      if not block: break
                      digest.update(block)
              assert digest.hexdigest() == expected, "Embedded GGUF SHA-256 mismatch"
              ways_name = next(n for n in z.namelist() if n.endswith("assets/reds_ways_of_thinking_canonical.jsonl"))
              rows = [json.loads(line) for line in z.read(ways_name).decode().splitlines() if line.strip()]
              assert len(rows) == 38, f"Expected 38 framework statements, got {len(rows)}"
              notice_name = next(n for n in z.namelist() if n.endswith("assets/RED AI MODEL NOTICE.txt"))
              notice = z.read(notice_name).decode()
              assert "Apache License 2.0" in notice and "MiniCPM5-1B" in notice and "Fine-tuned RedAI candidate" in notice
          print("Verified the exact bundled GGUF checksum and all 38 canonical framework statements inside the APK.")
          PY
          echo "RedAI runtime, bundled brain, first-launch bootstrap, framework context, creator identity and offline-search checks passed."

      - name: Prepare named APK and SHA-256 checksum
        run: |
          set -euo pipefail
          mkdir -p release
          cp android-ui/app/build/outputs/apk/debug/app-debug.apk release/RedAI-Android-v5.5.1.apk
          test -s release/RedAI-Android-v5.5.1.apk
          test "$(stat -c%s release/RedAI-Android-v5.5.1.apk)" -gt 600000000
          sha256sum release/RedAI-Android-v5.5.1.apk > release/SHA256SUMS.txt
          sha256sum -c release/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedAI-Android-v5.5.1-arm64
          path: |
            release/RedAI-Android-v5.5.1.apk
            release/SHA256SUMS.txt

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: redai-android-v5.5.1
          target_commitish: ${{ github.sha }}
          name: RedAI Android v5.5.1 — LittleRedBigSmile Edition
          body: |
            RedAI Android 5.5.1 with the fine-tuned MiniCPM5-1B Q4_K_M RedAI GGUF, protected deferred native engine initialization with a 1,280 MB RAM preflight and 512-token context, resilient Compose lifecycle, crash diagnostics, premium black/red redesign with conservative ARM64 runtime, ARM64 streaming runtime, persistent chats and optional live search. This is a debug-signed ARM64 test build; physical Galaxy A12 validation is still required.

            Foundation model: MiniCPM5-1B (Apache-2.0). Red's fine-tuned RedAI checkpoint and the RedAI product/persona integration are built and personalized by LittleRedBigSmile.
          files: |
            release/RedAI-Android-v5.5.1.apk
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
