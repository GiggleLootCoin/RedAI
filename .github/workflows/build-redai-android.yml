name: Build RedAI Android

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "android-ui/**"
      - ".github/workflows/build-redai-android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Build ARM64 release APK
        working-directory: android-ui
        run: gradle --no-daemon assembleRelease

      - name: Verify APK exists
        run: |
          test -s android-ui/app/build/outputs/apk/release/app-release.apk
          unzip -l android-ui/app/build/outputs/apk/release/app-release.apk | grep -q "classes.dex"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedAI-Android-arm64-release
          path: android-ui/app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="redai-android"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG"             android-ui/app/build/outputs/apk/release/app-release.apk             --title "RedAI Android — Local GGUF"             --notes "Free, offline-first RedAI Android UI. Uses the RedAI Q4_K_M GGUF with llama.cpp on-device inference. CPU/ARM64 build for Android."             --latest
