name: Build RedAI Android

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "android-ui/**"
      - "bridge/**"
      - "WEB_SEARCH.md"
      - ".github/workflows/build-redai-android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Test standalone search bridge
        run: |
          python3 -m unittest discover -s bridge -p 'test_*.py' -v
          python3 -m json.tool bridge/search_web_tool.json > /dev/null
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "bridge")
          import redai_search_bridge as bridge
          result = bridge.search("Wikipedia live search smoke test", "wikipedia")
          assert result["ok"] and result["results"], "No live Wikipedia search results returned"
          assert all(item["url"].startswith("https://") for item in result["results"]), "A source URL was missing or unsafe"
          print("Live no-key Wikipedia search returned", len(result["results"]), "source links.")
          PY

      - name: Build signed ARM64 APK
        working-directory: android-ui
        run: gradle --no-daemon assembleDebug

      - name: Verify APK runtime and UI
        run: |
          set -euo pipefail
          APK="android-ui/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q "classes.dex"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libllama.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libllama_jni.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libggml-cpu.so"
          grep -Fq 'append(userText)' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq '/no_think' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'You are RedAI, a distinct AI created and personalized by Red' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'You are not Red' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'Your underlying foundation model is the one represented by the GGUF file currently loaded' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'Do not automatically accept official accounts or automatically reject them' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'Akashic Records' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -q 'CREATED WITH LOVE BY LITTLE RED BIG SMILE' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -q 'class WebSearchService' android-ui/app/src/main/java/com/giggleloot/redai/WebSearchService.kt
          grep -q 'AES/GCM/NoPadding' android-ui/app/src/main/java/com/giggleloot/redai/WebSearchService.kt
          grep -q 'webSearch.search(query, webProvider)' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -q 'searchWikipedia' android-ui/app/src/main/java/com/giggleloot/redai/WebSearchService.kt
          grep -q 'searchTavily' android-ui/app/src/main/java/com/giggleloot/redai/WebSearchService.kt
          grep -Fq 'temporary = File(dir, "RedAI.gguf.part")' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'That file is not a valid GGUF file' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'do not guess its name or developer' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -q 'versionName = "3.5"' android-ui/app/build.gradle.kts
          echo "RedAI Android runtime libraries, response path, creator identity, epistemic guardrails and v3.5 UI, generic foundation identity and atomic GGUF import checks passed."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedAI-Android-arm64-signed
          path: android-ui/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="redai-android"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG"             android-ui/app/build/outputs/apk/debug/app-debug.apk             --title "RedAI Android — Local GGUF"             --notes "RedAI Android v3.5 with local GGUF chat, optional automatic DuckDuckGo/Wikipedia/Tavily live search, honest offline handling, source citations with tappable URLs, Android Keystore-encrypted optional Tavily key, RedAI identity guardrails, and verified ARM64 llama.cpp runtime libraries. Installable CPU/ARM64 debug build for Android."             --latest
