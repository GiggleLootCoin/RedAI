name: Build RedAI Android

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main", "redai-redesign-v4"]
    paths:
      - "android-ui/**"
      - "bridge/**"
      - "WEB_SEARCH.md"
      - ".github/workflows/build-redai-android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download and verify the selected Qwen3.5-0.8B Q4_K_M brain
        run: |
          set -euo pipefail
          mkdir -p android-ui/app/src/main/assets
          MODEL_URL="https://huggingface.co/lmstudio-community/Qwen3.5-0.8B-GGUF/resolve/main/Qwen3.5-0.8B-Q4_K_M.gguf"
          curl -L --fail --retry 5 --retry-all-errors --connect-timeout 30 --output android-ui/app/src/main/assets/RedAI.gguf "$MODEL_URL"
          echo "f5b14da98939b60bbe1019a964eba656407e1e0b64f1fe3003ff6d650e93bfec  android-ui/app/src/main/assets/RedAI.gguf" | sha256sum --check
          python3 - <<'PY'
          import json
          from pathlib import Path
          model = Path("android-ui/app/src/main/assets/RedAI.gguf")
          with model.open("rb") as f:
              assert f.read(4) == b"GGUF", "Downloaded model is not GGUF"
          assert model.stat().st_size > 500 * 1024 * 1024, "Unexpectedly small GGUF"
          source = Path("data/reds_ways_of_thinking_canonical.jsonl")
          rows = [json.loads(line) for line in source.read_text(encoding="utf-8").splitlines() if line.strip()]
          assert len(rows) == 38, f"Expected 38 canonical framework statements, got {len(rows)}"
          Path("android-ui/app/src/main/assets/reds_ways_of_thinking_canonical.jsonl").write_text(
              source.read_text(encoding="utf-8"), encoding="utf-8"
          )
          notice = Path("android-ui/app/src/main/assets/RED AI MODEL NOTICE.txt").read_text(encoding="utf-8")
          assert "Apache License 2.0" in notice and "Qwen3.5-0.8B" in notice
          print(f"Verified {model.stat().st_size:,}-byte Qwen3.5-0.8B GGUF and {len(rows)} canonical framework statements.")
          PY

      - name: Smoke-test the exact bundled GGUF with the app's llama.cpp version
        run: |
          set -euo pipefail
          git clone --depth 1 --branch b9878 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF
          cmake --build /tmp/llama.cpp/build --config Release -j2 --target llama-cli
          OUT="$(mktemp)"
          /tmp/llama.cpp/build/bin/llama-cli \
            -m android-ui/app/src/main/assets/RedAI.gguf \
            --jinja --single-turn --no-display-prompt \
            -n 48 --temp 0.1 --top-p 0.8 --top-k 20 \
            -p "Say hello in one clear sentence. /no_think" > "$OUT"
          cat "$OUT"
          grep -Eq '[[:alnum:]]' "$OUT"
          rm -f "$OUT"

      - name: Install Gradle
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Test standalone search bridge
        run: |
          python3 -m unittest discover -s bridge -p 'test_*.py' -v
          python3 -m json.tool bridge/search_web_tool.json > /dev/null
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "bridge")
          import redai_search_bridge as bridge
          result = bridge.search("Wikipedia live search smoke test", "wikipedia")
          assert result["ok"] and result["results"], "No live Wikipedia search results returned"
          assert all(item["url"].startswith("https://") for item in result["results"]), "A source URL was missing or unsafe"
          print("Live no-key Wikipedia search returned", len(result["results"]), "source links.")
          PY

      - name: Build signed ARM64 APK
        working-directory: android-ui
        run: gradle --no-daemon assembleDebug

      - name: Verify APK runtime and UI
        run: |
          set -euo pipefail
          APK="android-ui/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q "classes.dex"
          unzip -l "$APK" | grep -q "assets/RedAI.gguf"
          unzip -l "$APK" | grep -q "assets/reds_ways_of_thinking_canonical.jsonl"
          unzip -l "$APK" | grep -q "assets/RED AI MODEL NOTICE.txt"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libllama.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libllama_jni.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libggml-cpu.so"
          grep -Fq 'append(userText)' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq '/no_think' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'You are RedAI, a distinct AI created and personalized by Red' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'You are not Red' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'Your underlying foundation model is the one represented by the GGUF file currently loaded' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'Do not automatically accept official accounts or automatically reject them' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'Akashic Records' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -q 'CREATED WITH LOVE BY LITTLE RED BIG SMILE' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -q 'class WebSearchService' android-ui/app/src/main/java/com/giggleloot/redai/WebSearchService.kt
          grep -q 'AES/GCM/NoPadding' android-ui/app/src/main/java/com/giggleloot/redai/WebSearchService.kt
          grep -q 'webSearch.search(query, webProvider)' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -q 'searchWikipedia' android-ui/app/src/main/java/com/giggleloot/redai/WebSearchService.kt
          grep -q 'searchTavily' android-ui/app/src/main/java/com/giggleloot/redai/WebSearchService.kt
          grep -Fq 'temporary = File(dir, "RedAI.gguf.part")' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'The bundled GGUF failed its SHA-256 or file-format check.' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'redWaysOfThinkingPrompt()' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          ! grep -Fq 'LOAD REDAI GGUF' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -Fq 'do not guess its name or developer' android-ui/app/src/main/java/com/giggleloot/redai/MainActivity.kt
          grep -q 'versionName = "4.0"' android-ui/app/build.gradle.kts
          python3 - <<'PY'
          import hashlib, json, zipfile
          apk = "android-ui/app/build/outputs/apk/debug/app-debug.apk"
          expected = "f5b14da98939b60bbe1019a964eba656407e1e0b64f1fe3003ff6d650e93bfec"
          with zipfile.ZipFile(apk) as z:
              model_name = next(n for n in z.namelist() if n.endswith("assets/RedAI.gguf"))
              digest = hashlib.sha256()
              with z.open(model_name) as f:
                  magic = f.read(4)
                  assert magic == b"GGUF", "Embedded model is not GGUF"
                  digest.update(magic)
                  while True:
                      block = f.read(1024 * 1024)
                      if not block: break
                      digest.update(block)
              assert digest.hexdigest() == expected, "Embedded GGUF SHA-256 mismatch"
              ways_name = next(n for n in z.namelist() if n.endswith("assets/reds_ways_of_thinking_canonical.jsonl"))
              rows = [json.loads(line) for line in z.read(ways_name).decode().splitlines() if line.strip()]
              assert len(rows) == 38, f"Expected 38 framework statements, got {len(rows)}"
              notice_name = next(n for n in z.namelist() if n.endswith("assets/RED AI MODEL NOTICE.txt"))
              notice = z.read(notice_name).decode()
              assert "Apache License 2.0" in notice and "Qwen3.5-0.8B" in notice
          print("Verified the exact bundled GGUF checksum and all 38 canonical framework statements inside the APK.")
          PY
          echo "RedAI runtime, bundled brain, first-launch bootstrap, framework context, creator identity and offline-search checks passed."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedAI-Android-arm64-signed
          path: android-ui/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="redai-android-v4"
          APK="android-ui/app/build/outputs/apk/debug/app-debug.apk"
          TITLE="RedAI Android v4 — Bundled Qwen3.5"
          NOTES="RedAI Android with bundled Qwen3.5-0.8B Q4_K_M GGUF, automatic first-launch local model setup, Red's 38 canonical Ways Of Thinking statements in the system context, optional DuckDuckGo/Wikipedia/Tavily live search, honest offline handling, source citations, and ARM64 llama.cpp runtime. The foundation model is Qwen; Red created and personalized the RedAI product."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --latest
          else
            gh release create "$TAG" --title "$TITLE" --notes "$NOTES" --latest
          fi
          gh release upload "$TAG" "$APK" --clobber
